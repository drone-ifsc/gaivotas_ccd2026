# Config de logging python p/ nodes rospy rodando FORA da instalacao ROS
# (host RPi com rospypi/simple). Sem isso o rospy nao acha o
# python_logging.conf do /opt/ros, imprime "logging is disabled" e seta o
# logger em CRITICAL — todos os rospy.loginfo/logwarn somem.
# Apontado via ROS_PYTHON_LOG_CONFIG_FILE (feito em camera_host_server.py).

[loggers]
keys=root,rosout

[handlers]
keys=consoleHandler

[formatters]
keys=default

[logger_root]
level=INFO
handlers=consoleHandler

[logger_rosout]
level=INFO
handlers=consoleHandler
propagate=0
qualname=rosout

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[formatter_default]
format=[%(levelname)s] [%(asctime)s] %(message)s
datefmt=%H:%M:%S
